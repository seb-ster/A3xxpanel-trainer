<!DOCTYPE html>
<html>
<head>
    <title>Dark Grey Button</title>
    <style>
        body {
            background: #4a6fa5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .button-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .spec-info {
            color: #cccccc;
            font-size: 10px;
            margin-top: 10px;
            text-align: center;
            white-space: nowrap;
        }

        .label {
            display: none;
        }

        .switch-btn {
            width: 80px;
            height: 80px;
            background: #444;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            overflow: hidden;
        }

        .switch-btn::after {
            content: attr(data-label);
            position: absolute;
            bottom: 0;
            left: 0;
            transform: none;
            border: 2px solid white;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding: 6px 4px;
            font-size: 11px;
            white-space: nowrap;
            background: transparent;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.2;
        }

        .switch-btn:hover {
            background: #555;
        }

        .switch-btn.active {
            background: #00dd00;
            color: black;
            box-shadow: 0 0 16px rgba(0,221,0,0.8);
        }
    </style>
</head>
<body>
    <div class="button-container">
        <div class="button-group">
            <button class="switch-btn" data-label="OFF">OFF</button>
            <div class="spec-info">
                Height: 80px<br>
                Font: 11px<br>
                Label: 100% width
            </div>
        </div>

        <div class="button-group">
            <button class="switch-btn active" data-label="ON">ON</button>
            <div class="spec-info">
                Height: 80px<br>
                Font: 11px<br>
                Label: 100% width
            </div>
        </div>
    </div>
</body>
</html>
