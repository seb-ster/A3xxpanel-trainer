<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/C Panel Widget</title>
    <style>
        :root {
            --panel-bg: #4a6fa5;
            --control-bg: #f5f5f5;
            --border-color: #333;
            --text-color: #000;
            --active-color: #00dd00;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #2a2a2a;
            font-family: 'Arial', sans-serif;
        }

        .ac-panel-widget {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .panel-header {
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            position: relative;
        }

        .control-label {
            color: white;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .status-indicator.green {
            background: #00dd00;
            box-shadow: 0 0 4px #00dd00, inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .status-indicator.orange {
            background: #ff8800;
            box-shadow: 0 0 4px #ff8800, inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .status-indicator.white {
            background: #cccccc;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .toggle-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto;
            width: fit-content;
        }

        .switch-btn {
            padding: 6px 12px;
            border: 2px solid var(--border-color);
            background: var(--control-bg);
            color: var(--text-color);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .switch-btn:hover {
            background: #e0e0e0;
        }

        .switch-btn.active {
            background: var(--active-color);
            color: black;
            box-shadow: 0 0 8px rgba(0,221,0,0.6);
        }

        .switch-btn[data-value="OFF"] {
            border: 2px solid white;
        }

        .three-way-selector {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 0 auto;
        }

        .three-way-btn {
            padding: 6px 10px;
            border: 2px solid var(--border-color);
            background: var(--control-bg);
            color: var(--text-color);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            flex: 1;
            transition: all 0.2s ease;
        }

        .three-way-btn:hover {
            background: #e0e0e0;
        }

        .three-way-btn.active {
            background: var(--active-color);
            color: black;
            box-shadow: 0 0 6px rgba(0,221,0,0.5);
        }

        .panel-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .section-title {
            color: #ffff99;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .state-display {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            color: #00dd00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="ac-panel-widget" id="acPanel">
        <div class="panel-header">A/C SYSTEM CONTROL PANEL</div>

        <!-- Pack Flow Control -->
        <div class="panel-section">
            <div class="section-title">Pack Flow</div>
            <div class="panel-grid">
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        Pack Flow
                    </div>
                    <div class="three-way-selector">
                        <button class="three-way-btn" data-control="packFlow" data-value="LO">LO</button>
                        <button class="three-way-btn active" data-control="packFlow" data-value="NORM">NORM</button>
                        <button class="three-way-btn" data-control="packFlow" data-value="HI">HI</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cabin Temperature Controls -->
        <div class="panel-section">
            <div class="section-title">Cabin Temperature</div>
            <div class="panel-grid">
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        Cockpit
                    </div>
                    <div class="three-way-selector">
                        <button class="three-way-btn" data-control="cockpitTemp" data-value="COLD">COLD</button>
                        <button class="three-way-btn active" data-control="cockpitTemp" data-value="MID">MID</button>
                        <button class="three-way-btn" data-control="cockpitTemp" data-value="HOT">HOT</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        FWD Cabin
                    </div>
                    <div class="three-way-selector">
                        <button class="three-way-btn" data-control="fwdTemp" data-value="COLD">COLD</button>
                        <button class="three-way-btn active" data-control="fwdTemp" data-value="MID">MID</button>
                        <button class="three-way-btn" data-control="fwdTemp" data-value="HOT">HOT</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        AFT Cabin
                    </div>
                    <div class="three-way-selector">
                        <button class="three-way-btn" data-control="aftTemp" data-value="COLD">COLD</button>
                        <button class="three-way-btn active" data-control="aftTemp" data-value="MID">MID</button>
                        <button class="three-way-btn" data-control="aftTemp" data-value="HOT">HOT</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pack Controls -->
        <div class="panel-section">
            <div class="section-title">Pack Controls</div>
            <div class="panel-grid">
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        Pack 1
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn active" data-control="pack1" data-value="ON">ON</button>
                        <button class="switch-btn" data-control="pack1" data-value="OFF">OFF</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        Pack 2
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn active" data-control="pack2" data-value="ON">ON</button>
                        <button class="switch-btn" data-control="pack2" data-value="OFF">OFF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bleed Air Controls -->
        <div class="panel-section">
            <div class="section-title">Bleed Air</div>
            <div class="panel-grid">
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        ENG 1 Bleed
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn active" data-control="eng1Bleed" data-value="ON">ON</button>
                        <button class="switch-btn" data-control="eng1Bleed" data-value="OFF">OFF</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator green"></span>
                        ENG 2 Bleed
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn active" data-control="eng2Bleed" data-value="ON">ON</button>
                        <button class="switch-btn" data-control="eng2Bleed" data-value="OFF">OFF</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator white"></span>
                        APU Bleed
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn" data-control="apuBleed" data-value="ON">ON</button>
                        <button class="switch-btn active" data-control="apuBleed" data-value="OFF">OFF</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span class="status-indicator white"></span>
                        X Bleed
                    </div>
                    <div class="toggle-switch">
                        <button class="switch-btn" data-control="xBleed" data-value="ON">ON</button>
                        <button class="switch-btn active" data-control="xBleed" data-value="OFF">OFF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div class="state-display" id="statusDisplay">
            System Status:
            Pack Flow: NORM | Pack 1: ON | Pack 2: ON
            ENG 1 Bleed: ON | ENG 2 Bleed: ON | APU Bleed: OFF
        </div>
    </div>

    <script>
        class ACPanel {
            constructor(elementId) {
                this.panel = document.getElementById(elementId);
                this.state = {
                    packFlow: 'NORM',
                    cockpitTemp: 'MID',
                    fwdTemp: 'MID',
                    aftTemp: 'MID',
                    pack1: 'ON',
                    pack2: 'ON',
                    eng1Bleed: 'ON',
                    eng2Bleed: 'ON',
                    apuBleed: 'OFF',
                    xBleed: 'OFF'
                };

                this.init();
            }

            init() {
                this.panel.querySelectorAll('[data-control]').forEach(button => {
                    button.addEventListener('click', (e) => this.handleControl(e));
                });

                this.updateDisplay();
            }

            handleControl(event) {
                const control = event.target.dataset.control;
                const value = event.target.dataset.value;

                if (!control || !value) return;

                this.state[control] = value;
                this.updateControlUI(control);
                this.updateDisplay();

                this.panel.dispatchEvent(new CustomEvent('controlChange', {
                    detail: { control, value, state: this.state }
                }));
            }

            updateControlUI(control) {
                this.panel.querySelectorAll(`[data-control="${control}"]`).forEach(btn => {
                    btn.classList.remove('active');
                });

                const activeBtn = this.panel.querySelector(
                    `[data-control="${control}"][data-value="${this.state[control]}"]`
                );
                if (activeBtn) {
                    activeBtn.classList.add('active');
                }
            }

            updateDisplay() {
                const display = this.panel.querySelector('#statusDisplay');
                display.innerHTML = `
                    <strong>System Status:</strong><br>
                    Pack Flow: ${this.state.packFlow} | Pack 1: ${this.state.pack1} | Pack 2: ${this.state.pack2}<br>
                    Cockpit: ${this.state.cockpitTemp} | FWD: ${this.state.fwdTemp} | AFT: ${this.state.aftTemp}<br>
                    ENG 1: ${this.state.eng1Bleed} | ENG 2: ${this.state.eng2Bleed} | APU: ${this.state.apuBleed}
                `;
            }

            getState() {
                return { ...this.state };
            }

            setState(newState) {
                this.state = { ...this.state, ...newState };
                Object.keys(newState).forEach(control => this.updateControlUI(control));
                this.updateDisplay();
            }
        }

        const acPanel = new ACPanel('acPanel');

        document.getElementById('acPanel').addEventListener('controlChange', (e) => {
            console.log('Control Changed:', e.detail);
        });
    </script>
</body>
</html>
